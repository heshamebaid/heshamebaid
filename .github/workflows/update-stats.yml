name: Update README stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prefer STATS_GITHUB_TOKEN (classic PAT with repo + read:user) for private
      # contributions. Falls back to GITHUB_TOKEN for public stats.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=38BDF8&icon_color=0EA5E9&text_color=C9D1D9&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.STATS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=38BDF8&text_color=C9D1D9&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate profile summary cards
        continue-on-error: true
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: false

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p profile
          if [ -d profile-summary-card-output/tokyonight ]; then
            cp -f profile-summary-card-output/tokyonight/profile-details.svg profile/profile-details.svg || true
            cp -f profile-summary-card-output/tokyonight/repos-per-language.svg profile/repos-per-language.svg || true
            cp -f profile-summary-card-output/tokyonight/most-commit-language.svg profile/most-commit-language.svg || true
          fi
          git add profile/*.svg
          git diff --staged --quiet && echo "No stats changes" && exit 0
          git commit -m "chore: refresh GitHub profile stats"
          git push
